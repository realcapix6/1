name: macOS Cloud Desktop

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360

    env:
      VNC_USER: "CAPi"
      VNC_PASSWORD: "amirkiyani2008"

    steps:
      - name: 1. Create User, Enable SSH + Screen Sharing (VNC)
        run: |
          # Create the admin user
          sudo sysadminctl -addUser "$VNC_USER" -password "$VNC_PASSWORD" -admin
          echo "$VNC_USER ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/"$VNC_USER"

          # SSH (bonus shell access)
          sudo systemsetup -setremotelogin on
          sudo sed -i '' 's/^#*PasswordAuthentication .*/PasswordAuthentication yes/' /etc/ssh/sshd_config 2>/dev/null || true
          sudo launchctl load -w /System/Library/LaunchDaemons/ssh.plist 2>/dev/null || true

          # Keep display awake + auto-login so VNC shows a real desktop
          sudo pmset -a sleep 0 displaysleep 0 || true
          sudo -u "$VNC_USER" defaults write com.apple.screensaver idleTime 0 || true
          sudo defaults write /Library/Preferences/com.apple.screensaver askForPassword -int 0 || true
          sudo defaults write /Library/Preferences/com.apple.loginwindow autoLoginUser "$VNC_USER" || true

          # Enable Screen Sharing / VNC with a VNC password
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvncpw -vncpw "$VNC_PASSWORD" \
            -restart -agent
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true

          # Best-effort: switch the console to the VNC user's session
          CAP_UID=$(id -u "$VNC_USER" 2>/dev/null || echo "")
          if [ -n "$CAP_UID" ]; then
            /System/Library/CoreServices/Menu\ Extras/User.menu/Contents/Resources/CGSession -switchToUserID "$CAP_UID" >/dev/null 2>&1 &
          fi

          echo "SSH + Screen Sharing (VNC :5900) enabled for $VNC_USER"

      - name: 2. Expose SSH(22) + VNC(5900) via public tunnels + Keep Alive
        run: |
          set +e
          # Install cloudflared (no account needed) for the current arch
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then CF_ARCH="arm64"; else CF_ARCH="amd64"; fi
          curl -fsSL "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-${CF_ARCH}.tgz" -o /tmp/cf.tgz
          tar xzf /tmp/cf.tgz -C /tmp
          sudo install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared 2>/dev/null || install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared

          # Public TCP tunnels: cloudflare edge -> this Mac's localhost:22 and :5900
          cloudflared tunnel --url ssh://localhost:22 --no-autoupdate > /tmp/cf_ssh.log 2>&1 &
          cloudflared tunnel --url tcp://localhost:5900 --no-autoupdate > /tmp/cf_vnc.log 2>&1 &
          sleep 18

          SSH_ADDR=$(grep -oE 'tcp://[a-z0-9.-]+:[0-9]+' /tmp/cf_ssh.log | head -1)
          VNC_ADDR=$(grep -oE 'tcp://[a-z0-9.-]+:[0-9]+' /tmp/cf_vnc.log | head -1)

          echo ""
          echo "=================================================="
          echo "  >>> macOS DESKTOP SERVER IS READY! <<<"
          if [ -n "$SSH_ADDR" ]; then
            SH=$(echo "$SSH_ADDR" | sed -E 's#tcp://##; s/:[0-9]+$//')
            SP=$(echo "$SSH_ADDR" | sed -E 's#tcp://[a-z0-9.-]+:##')
            echo "  SSH : ssh $VNC_USER@$SH -p $SP"
          fi
          if [ -n "$VNC_ADDR" ]; then
            echo "  VNC : $VNC_ADDR"
            echo "       (open TightVNC / RealVNC Viewer -> $VNC_ADDR)"
            echo "       user: $VNC_USER   password: $VNC_PASSWORD"
          fi
          echo "  macOS version: $(sw_vers -productVersion)"
          echo "=================================================="

          for i in $(seq 1 360); do
            sleep 60
            echo "[$i/360] macOS desktop server running..."
          done
