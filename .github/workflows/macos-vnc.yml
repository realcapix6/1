name: macOS Cloud VNC

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360

    env:
      VNC_USER: "CAPi"
      VNC_PASSWORD: "amirkiyani2008"

    steps:
      - name: 1. Create User & Enable Screen Sharing (VNC)
        run: |
          # Create the VNC admin user (runners have FDE off, so no password-conflict issue)
          sudo sysadminctl -addUser "$VNC_USER" -password "$VNC_PASSWORD" -admin
          echo "$VNC_USER ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/"$VNC_USER"

          # Keep the display awake and never lock (headless CI would otherwise show a black screen over VNC)
          sudo pmset -a sleep 0 displaysleep 0 lock 0
          sudo -u "$VNC_USER" defaults write com.apple.screensaver idleTime 0
          sudo defaults write /Library/Preferences/com.apple.loginwindow autoLoginUser "$VNC_USER"

          # Enable Apple Remote Desktop / Screen Sharing with a VNC password
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -users "$VNC_USER" -privs -all \
            -clientopts -setvncpw -vncpw "$VNC_PASSWORD" -restart -agent

          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true

          # Best-effort: switch the GUI console to the VNC user's session
          CAP_UID=$(id -u "$VNC_USER")
          /System/Library/CoreServices/Menu\ Extras/User.menu/Contents/Resources/CGSession -switchToUserID "$CAP_UID" >/dev/null 2>&1 &

          echo "Screen Sharing enabled on :5900 for user $VNC_USER"

      - name: 2. Install & Connect Tailscale + Keep Alive
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          set +e
          # Try Homebrew install first
          if command -v brew >/dev/null 2>&1; then
            brew install tailscale
          fi
          # Fallback to the official .pkg if brew didn't provide tailscaled
          if ! command -v tailscaled >/dev/null 2>&1 && ! [ -x /Applications/Tailscale.app/Contents/MacOS/tailscaled ]; then
            VER=$(curl -fsSL https://pkgs.tailscale.com/stable/ | grep -oE 'Tailscale-[0-9.]+-macos' | head -1 | sed 's/Tailscale-//;s/-macos//')
            curl -fsSL "https://pkgs.tailscale.com/stable/Tailscale-${VER}-macos.pkg" -o /tmp/tailscale.pkg
            sudo installer -pkg /tmp/tailscale.pkg -target /
          fi

          # Stop any pre-installed GUI daemon so we can run userspace tailscaled
          sudo launchctl unload /Library/LaunchDaemons/com.tailscale.tailscaled.plist 2>/dev/null || true
          sudo pkill -f tailscaled 2>/dev/null || true
          sleep 2

          # Pick the tailscale binaries
          if [ -x /Applications/Tailscale.app/Contents/MacOS/tailscaled ]; then
            TS=/Applications/Tailscale.app/Contents/MacOS/Tailscale
            TSD=/Applications/Tailscale.app/Contents/MacOS/tailscaled
          else
            TS=tailscale
            TSD=tailscaled
          fi

          # Run tailscaled in userspace mode (no system-extension approval needed)
          sudo "$TSD" --tun=userspace-networking --state=/tmp/tailscale.state >/tmp/tailscaled.log 2>&1 &
          sleep 6

          # 'tailscale up' can hang on CI; cap it at 60s
          ( sudo "$TS" up --authkey="$TAILSCALE_AUTHKEY" --hostname="github-macos-vnc" --ssh ) &
          UP_PID=$!
          for i in $(seq 1 60); do
            if ! kill -0 $UP_PID 2>/dev/null; then break; fi
            sleep 1
          done
          if kill -0 $UP_PID 2>/dev/null; then kill $UP_PID 2>/dev/null; fi

          sleep 8
          TS_IP=$("$TS" ip -4)

          echo ""
          echo "=================================================="
          echo "  >>> macOS VNC SERVER IS READY! <<<"
          echo "  Tailscale host: github-macos-vnc"
          echo "  Tailscale IP  : $TS_IP"
          echo "  VNC user      : $VNC_USER"
          echo "  VNC password  : $VNC_PASSWORD"
          echo "  VNC port      : 5900"
          echo "=================================================="

          # Keep the job (and tailscaled) alive for up to 6 hours
          for i in $(seq 1 360); do
            sleep 60
            echo "[$i/360] macOS VNC server running..."
          done
